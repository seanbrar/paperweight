[project]
name = "academic-paperweight"
version = "0.1.2"
description = "Automated retrieval, filtering, and LLM-powered summarization of arXiv papers based on your research interests."
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = { text = "MIT" }
authors = [{ name = "Sean Brar", email = "hello@seanbrar.com" }]
keywords = [
    "arxiv",
    "research",
    "papers",
    "academic",
    "llm",
    "summarization",
    "machine-learning",
    "ai",
    "notifications",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]
dependencies = [
    "arxiv>=2.1.0",
    "pypdf>=4.3.1",
    "psycopg[binary]>=3.2.1",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "requests>=2.31.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.9.0",
    "pollux-ai>=1.0.0a0",
]

[project.scripts]
paperweight = "paperweight.main:main"

[project.optional-dependencies]
dev = [
    "html2text>=2024.2.26",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.6.4",
    "types-PyYAML>=6.0.12.20240808",
    "types-requests>=2.32.0.20240907",
]

[project.urls]
Homepage = "https://github.com/seanbrar/paperweight"
Repository = "https://github.com/seanbrar/paperweight"
Changelog = "https://github.com/seanbrar/paperweight/blob/main/CHANGELOG.md"
Issues = "https://github.com/seanbrar/paperweight/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperweight"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "C90", "I001", "F401"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "arxiv.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=paperweight --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "api: marks tests requiring real external APIs (database, etc.)",
]
testpaths = ["tests"]
pythonpath = ["src"]
