# Copy this file to config.yaml and customize values.

arxiv:
  categories:
    - cs.AI
    - cs.CL
    - cs.LG
  max_results: 50

processor:
  keywords:
    - transformer
    - reasoning
    - language model
  exclusion_keywords: []
  important_words: []
  title_keyword_weight: 3
  abstract_keyword_weight: 2
  content_keyword_weight: 1
  exclusion_keyword_penalty: 5
  important_words_weight: 0.5
  min_score: 10

analyzer:
  type: abstract  # summary | abstract
  llm_provider: openai  # openai | gemini
  # api_key: ${OPENAI_API_KEY}
  max_input_tokens: 7000
  max_input_chars: 20000

# AI-first shortlist gate (title + abstract)
triage:
  enabled: true
  llm_provider: openai  # openai | gemini
  # api_key: ${OPENAI_API_KEY}
  min_score: 60
  max_selected: 25

logging:
  level: INFO  # DEBUG | INFO | WARNING | ERROR
  file: paperweight.log

# Optional metadata for --delivery atom
feed:
  title: paperweight
  id: https://github.com/seanbrar/paperweight
  link: https://github.com/seanbrar/paperweight

# Optional section for --delivery email
# notifier:
#   email:
#     to: "you@example.com"
#     from: "you@example.com"
#     password: "${EMAIL_PASSWORD}"
#     smtp_server: "smtp.example.com"
#     smtp_port: 587
#     use_tls: true
#     use_auth: true
#     sort_order: relevance

# Optional Postgres persistence
db:
  enabled: false
  host: localhost
  port: 5432
  database: paperweight
  user: paperweight
  password: "${DB_PASSWORD}"
  sslmode: prefer

# Optional artifact storage path
storage:
  base_dir: data/artifacts
